name: Compilar APK (Python / Kivy)

on:
  push:
    paths:
      - "python_app/**"
      - ".github/workflows/build-python-apk.yml"
  pull_request:
    paths:
      - "python_app/**"
      - ".github/workflows/build-python-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pruebas de la lógica
        working-directory: python_app
        run: python -m unittest discover -s tests -v

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev unzip zip

      - name: Instalar buildozer
        run: pip install --upgrade buildozer cython setuptools

      - name: Caché de buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            python_app/.buildozer
          key: buildozer-${{ hashFiles('python_app/buildozer.spec') }}

      - name: Compilar APK
        working-directory: python_app
        run: yes | buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: dose-python-apk
          path: python_app/bin/*.apk
          if-no-files-found: error
